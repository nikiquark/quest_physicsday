<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 1400">
  <!--
    Building plan: two floors, each an upside-down "П" drawn as an extruded block
    (top face + visible side walls). First floor on top with the entrance, second floor below it.
    Station pins are positioned on top of this image in fractions of the viewBox (0..1),
    so the drawing can be edited freely as long as the viewBox stays 1000x1400
    (MAP_WIDTH / MAP_HEIGHT in QuestMap.tsx).
  -->
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#eef0f5"/>
    </linearGradient>

    <!-- One floor, drawn from y=0 (520 tall + 36 of visible walls). -->
    <g id="floor">
      <g stroke="#1c1c1c" stroke-width="3" stroke-linejoin="round">
        <polygon points="330,0 352,36 352,356 330,320" fill="#c9cdd8"/>
        <polygon points="900,0 922,36 922,556 900,520" fill="#c9cdd8"/>
        <polygon points="100,520 900,520 922,556 122,556" fill="#dde0e8"/>
      </g>
      <polygon
        points="100,0 330,0 330,320 670,320 670,0 900,0 900,520 100,520"
        fill="url(#roof)" stroke="#1c1c1c" stroke-width="3" stroke-linejoin="round"/>
      <polyline points="215,30 215,420 785,420 785,30"
                stroke="#d5d8e1" stroke-width="2" stroke-dasharray="8 8" fill="none"/>
    </g>
  </defs>

  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-weight="700" fill="#111">
    <text x="100" y="60" font-size="30">Первый этаж</text>
    <text x="100" y="800" font-size="30">Второй этаж</text>
  </g>

  <use href="#floor" xlink:href="#floor" y="80"/>
  <use href="#floor" xlink:href="#floor" y="820"/>

  <!-- entrance (first floor) -->
  <rect x="470" y="598" width="60" height="6" fill="#344ead"/>
  <g fill="#344ead">
    <polygon points="500,648 486,668 514,668"/>
    <rect x="496" y="666" width="8" height="18"/>
  </g>
  <text x="500" y="720" text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="30" font-weight="700" fill="#111">Вход</text>
</svg>
