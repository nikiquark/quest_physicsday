<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 1020">
  <!--
    Building plan: two floors, each an upside-down "П" drawn as an extruded block
    (top face + visible side walls). First floor on top with the entrance, second floor below it.
    Station pins are positioned on top of this image in fractions of the viewBox (0..1),
    so the drawing can be edited freely as long as the viewBox stays 1000x1020
    (MAP_WIDTH / MAP_HEIGHT in QuestMap.tsx).
  -->
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f8fb"/>
      <stop offset="1" stop-color="#eef0f5"/>
    </linearGradient>

    <!-- One floor, drawn from y=0 (360 tall + 36 of visible walls): legs 0..160, crossbar 160..360. -->
    <g id="floor">
      <g stroke="#1c1c1c" stroke-width="3" stroke-linejoin="round">
        <polygon points="330,0 352,36 352,196 330,160" fill="#c9cdd8"/>
        <polygon points="900,0 922,36 922,396 900,360" fill="#c9cdd8"/>
        <polygon points="100,360 900,360 922,396 122,396" fill="#dde0e8"/>
      </g>
      <polygon
        points="100,0 330,0 330,160 670,160 670,0 900,0 900,360 100,360"
        fill="url(#roof)" stroke="#1c1c1c" stroke-width="3" stroke-linejoin="round"/>
      <polyline points="215,30 215,260 785,260 785,30"
                stroke="#d5d8e1" stroke-width="2" stroke-dasharray="8 8" fill="none"/>
    </g>
  </defs>

  <use href="#floor" xlink:href="#floor" y="40"/>
  <use href="#floor" xlink:href="#floor" y="580"/>

  <!-- floor labels, centered in the opening of each "П" (x 330..670, y 0..160 of the floor) -->
  <g font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif" font-weight="700" font-size="40"
     fill="#111" text-anchor="middle" dominant-baseline="central">
    <text x="500" y="120">1 этаж</text>
    <text x="500" y="660">2 этаж</text>
  </g>

  <!-- entrance (first floor) -->
  <rect x="470" y="398" width="60" height="6" fill="#344ead"/>
  <g fill="#344ead">
    <polygon points="500,448 486,468 514,468"/>
    <rect x="496" y="466" width="8" height="18"/>
  </g>
  <text x="500" y="520" text-anchor="middle"
        font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif"
        font-size="30" font-weight="700" fill="#111">Вход</text>
</svg>
