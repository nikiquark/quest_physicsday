name: physquest-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: physquest
      POSTGRES_USER: physquest
      POSTGRES_PASSWORD: physquest
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physquest -d physquest"]
      interval: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 30

  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "*"
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: admin
      POSTGRES_HOST: postgres
      POSTGRES_DB: physquest
      POSTGRES_USER: physquest
      POSTGRES_PASSWORD: physquest
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      DEV_HTTPS: ${DEV_HTTPS:-0}
      BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata-dev:
  frontend-node-modules:
